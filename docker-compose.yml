version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai_interviewer_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewer
      POSTGRES_PASSWORD: interviewer_password
      POSTGRES_DB: ai_interviewer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewer -d ai_interviewer"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

